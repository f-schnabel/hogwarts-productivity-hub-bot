on:
  workflow_dispatch:
  workflow_run:
    workflows: CI
    types:
      - completed
    branches:
      - main

name: Deploy to Oracle Cloud

jobs:
  build:
    name: Build and Deploy
    runs-on: ubuntu-latest
    if: ${{ (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') || github.event_name == 'workflow_dispatch' }}
    environment: OCI
    steps:
      - name: Deploy
        uses: appleboy/ssh-action@v1
        env:
          # Passed as an env var (not inlined) so quotes in commit messages can't break the script
          COMMIT_MESSAGE: ${{ github.event.workflow_run.head_commit.message || 'manual deploy' }}
        with:
          envs: COMMIT_MESSAGE
          host: ${{ secrets.OCI_HOST }}
          username: ubuntu
          key: ${{ secrets.OCI_PRIVATE_KEY }}
          script: |
            export PATH=/home/ubuntu/n/bin:/home/ubuntu/.bun/bin:$PATH
            export CI=true
            cd hogwarts-productivity-hub-bot && 
            git pull &&
            pnpm install &&
            pnpm typecheck &&
            pnpm register &&
            npx drizzle-kit migrate &&
            systemctl --user restart hogwarts-bot.service &&
            curl -k -X POST http://localhost:3000/api/annotations \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer ${{ secrets.OCI_GRAFANA_API_KEY }}" \
              -d "$(node -e 'console.log(JSON.stringify({ text: `Deployment "${process.env.COMMIT_MESSAGE}"`, tags: ["deploy", "hogwarts-bot"] }))')"
